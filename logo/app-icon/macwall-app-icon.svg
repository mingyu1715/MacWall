<svg xmlns="http://www.w3.org/2000/svg"
     width="1024"
     height="1024"
     viewBox="0 0 1024 1024"
     role="img"
     aria-labelledby="title desc">
  <title id="title">MacWall app icon</title>
  <desc id="desc">The MacWall gradient laptop symbol on a rounded dark app icon.</desc>

  <defs>
    <linearGradient id="iconBackground" x1="128" y1="96" x2="896" y2="928"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#252A36"/>
      <stop offset=".48" stop-color="#141720"/>
      <stop offset="1" stop-color="#08090D"/>
    </linearGradient>

    <radialGradient id="iconGlow" cx="50%" cy="22%" r="80%">
      <stop offset="0" stop-color="#5360FF" stop-opacity=".16"/>
      <stop offset=".52" stop-color="#5360FF" stop-opacity=".025"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="brand" x1="225" y1="305" x2="815" y2="735"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#24C9FF"/>
      <stop offset=".24" stop-color="#2E8CFF"/>
      <stop offset=".52" stop-color="#5360FF"/>
      <stop offset=".76" stop-color="#8A48FF"/>
      <stop offset="1" stop-color="#C832F4"/>
    </linearGradient>

    <linearGradient id="brandHighlight" x1="260" y1="290" x2="760" y2="700"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".18"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".08"/>
    </linearGradient>

    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="155%">
      <feDropShadow dx="0" dy="28" stdDeviation="32"
                    flood-color="#000000" flood-opacity=".45"/>
    </filter>

    <filter id="symbolShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="14"
                    flood-color="#000000" flood-opacity=".42"/>
    </filter>

    <mask id="baseCutout" x="170" y="700" width="684" height="68"
          maskUnits="userSpaceOnUse">
      <rect x="170" y="700" width="684" height="68" fill="#FFFFFF"/>
      <path d="
        M444 727
        H580
        L576 741
        Q573 746 564 746
        H460
        Q451 746 448 741
        Z"
        fill="#000000"/>
    </mask>
  </defs>

  <g filter="url(#iconShadow)">
    <rect x="64" y="54" width="896" height="896" rx="205"
          fill="url(#iconBackground)"/>
    <rect x="64" y="54" width="896" height="896" rx="205"
          fill="url(#iconGlow)"/>
    <rect x="76" y="66" width="872" height="872" rx="194"
          fill="none" stroke="#FFFFFF" stroke-opacity=".11" stroke-width="5"/>
    <rect x="91" y="81" width="842" height="842" rx="181"
          fill="none" stroke="#000000" stroke-opacity=".34" stroke-width="4"/>
  </g>

  <g transform="translate(103 105) scale(.8)" filter="url(#symbolShadow)">
    <path fill="url(#brand)" fill-rule="evenodd" d="
      M256 294
      H300
      L512 469
      L724 294
      H768
      Q786 294 786 313
      V679
      Q786 697 768 697
      H256
      Q238 697 238 679
      V313
      Q238 294 256 294
      Z

      M300 382
      V638
      H724
      V382
      L512 556
      Z
    "/>

    <path fill="url(#brandHighlight)" fill-rule="evenodd" opacity=".55" d="
      M256 294
      H300
      L512 469
      L724 294
      H768
      Q786 294 786 313
      V679
      Q786 697 768 697
      H256
      Q238 697 238 679
      V313
      Q238 294 256 294
      Z

      M300 382
      V638
      H724
      V382
      L512 556
      Z
    "/>

    <path d="
      M184 716
      H840
      Q836 735 821 744
      Q809 752 787 752
      H237
      Q215 752 203 744
      Q188 735 184 716
      Z"
      fill="url(#brand)"
      mask="url(#baseCutout)"/>
  </g>
</svg>
